name: hisab_kitab
description: "HisabKitab - Group expense tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Fixes the "decodeLazy isn't defined for ZLibDecoder" error
dependency_overrides:
  image: 4.5.4

flutter:
  uses-material-design: true